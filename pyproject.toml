[project]
name = "grader-helper"
version = "0.1.15"
description = "Functions to help manage assignments from UL which are hosted on Brightspace"
description-content-type = "text/markdown"
authors = [{name = "Kevin O Malley", email = "kev.c.omalley@pm.me"}]
license = "MIT"
readme = "README.md"
packages = [{include = "grader_helper"}]
dependencies = [
    "numpy>=2.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    # The quiz collection is written in polars, which is also the direction
    # the rest of the package is migrating in. House convention imports it
    # as `pr`, not `pl` -- `pl` is pathlib here.
    "polars>=1.0",
    "python-calamine>=0.4.0",
    "tqdm>=4.67.1",
    # xlwings drives Excel on both supported platforms -- COM on Windows,
    # AppleScript on macOS -- so it must NOT be gated on Windows alone.
    "xlwings>=0.33.5; platform_system == 'Windows' or platform_system == 'Darwin'",
    # Provides pythoncom, which xlwings needs for COM. Windows only, and
    # previously an undeclared implicit dependency.
    "pywin32>=306; platform_system == 'Windows'",
    "pydantic>=2.13.4",
    "tomlkit>=0.13.3",
]
requires-python = ">=3.13"

# A terminal command for the marking simulator, so it runs without -m --
# which warns, because the repo directory is itself called grader_helper and
# holds a shim __init__.py, so the package is already imported by the time
# runpy goes looking for the submodule.
#
# This table sits after every one of [project]'s scalars, not before them.
# A scalar written after a sub-table is parsed INTO that sub-table, which is
# the same hazard module.toml's writer is built around -- and putting this
# above `dependencies` really did move the dependency list into
# [project.scripts] and break the build.
[project.scripts]
simulate-marking = "grader_helper.simulating:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "marimo>=0.14.17",
    "matplotlib>=3.9,<3.10",
    "faker>=38.2.0",
    "pytest>=8.4.1",
    "packaging>=24.0",
]


[tool.hatch.build.targets.wheel]
packages = ["grader_helper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "excel: requires a working Excel installation (Windows or macOS); skipped elsewhere",
]
