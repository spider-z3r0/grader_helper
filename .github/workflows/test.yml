name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Windows is first-class, macOS second. Linux is not a supported target,
    # so it is not tested here.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --group dev

      # Neither runner has Excel installed, so tests marked `excel` are
      # deselected here. They are covered by the manual end-to-end check on
      # a real machine.
      - name: Run tests
        run: uv run pytest -q -m "not excel"
